name: Build Windows EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run pc:build

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-windows-exe
          path: release/*.exe
